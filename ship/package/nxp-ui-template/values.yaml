# Default values for front-service.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
#

global:
  productVersion: "undefined"
  registry: ""
  imagePullSecrets: []

replicaCount: 2

project:
  eaasUrl: "https://socle-dev-sf.s2m.ma/vault/api/"
  tracingUrl: "https://socle-dev-sf.s2m.ma/tracing/api/"
  keycloakUrl: "https://keycloak-dev-sf.s2m.ma/auth"
  keycloakRealm: "SOCLE"
  keycloakClientId: "frontend"

image:
  repository: nxp-ui-template
  pullPolicy: IfNotPresent
  # Overrides the image tag whose default is the chart appVersion.
  tag: "0.0.1"

nameOverride: ""
fullnameOverride: ""

serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

podAnnotations: {}

podSecurityContext: {}
  # fsGroup: 2000
  
securityContext:
  capabilities:
    drop:
    - ALL
  # readOnlyRootFilesystem: true
  runAsNonRoot: true
  runAsUser: 1000

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
    # kubernetes.io/ingress.class: nginx
    # kubernetes.io/tls-acme: "true"
  hosts:
    - host: chart-example.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
  #  - secretName: chart-example-tls
  #    hosts:
  #      - chart-example.local

resources:
  limits:
    cpu: 300m
    memory: 512Mi
  requests:
    cpu: 300m
    memory: 512Mi


strategy: {}

readinessProbe:
  enabled: true
  httpGet:
    path: "/actuator/health"
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1

livenessProbe:
  enabled: true
  httpGet:
    path: "/actuator/health"
    port: 9090
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 1
  failureThreshold: 3
  successThreshold: 1


nodeSelector: {}

tolerations: []

affinity: {}
